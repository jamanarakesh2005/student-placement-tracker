
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Placement Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Placement Tracker</h1>
    <p>Prepare today. Succeed tomorrow.</p>
  </header>

  <main>
    <section class="stats">
      <div class="card">
        <h3>Total Tasks</h3>
        <p id="total">0</p>
      </div>
      <div class="card">
        <h3>Completed</h3>
        <p id="completed">0</p>
      </div>
      <div class="card">
        <h3>Pending</h3>
        <p id="pending">0</p>
      </div>
    </section>

    <section class="task-section">
      <h2>My Preparation Tasks</h2>

      <form id="taskForm">
        <input
          type="text"
          id="taskInput"
          placeholder="Enter your task..."
          required
        >
        <button type="submit">Add Task</button>
      </form>

      <ul id="taskList"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
